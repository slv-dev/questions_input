<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Code Check</title>
<style>
* {
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body {
margin: 0;
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: #8c8c8c; /* серый как на макете */
transition: background 0.3s ease;
}

.container {
text-align: center;
}

h1 {
color: rgba(0,0,0,0.6);
margin-bottom: 40px;
font-size: 56px;
}

.code-input {
display: flex;
gap: 16px;
justify-content: center;
}

.code-input input {
width: 40px;
height: 50px;
font-size: 28px;
text-align: center;
border: none;
border-bottom: 4px solid rgba(0,0,0,0.5);
outline: none;
background: transparent; /* убрали белый фон */
color: rgba(0,0,0,0.7);
}

.hidden {
display: none;
}

.result {
font-size: 72px;
font-weight: bold;
color: rgba(0,0,0,0.6);
margin-bottom: 30px;
}

.btn {
padding: 12px 24px;
border: none;
background: rgba(0,0,0,0.25);
color: white;
font-size: 16px;
cursor: pointer;
border-radius: 6px;
transition: 0.2s;
}

.btn:hover {
background: rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<div class="container" id="inputScreen">
<h1>Введите код</h1>
<div class="code-input" id="inputs"></div>
</div>

<div class="container hidden" id="successScreen">
<div class="result">ВЕРНО!</div>
</div>

<div class="container hidden" id="errorScreen">
<div class="result">НЕВЕРНО!</div>
<button class="btn" onclick="reset()">Попробовать ещё раз</button>
</div>

<script>
const correctCode = "1234567890";
const inputsContainer = document.getElementById("inputs");

for (let i = 0; i < 10; i++) {
const input = document.createElement("input");

input.inputMode = "numeric";
input.pattern = "[0-9]*";
input.maxLength = 1;

input.addEventListener("input", (e) => {
e.target.value = e.target.value.replace(/\D/g, "");

if (e.target.value && input.nextElementSibling) {
input.nextElementSibling.focus();
}

checkCode();
});

input.addEventListener("keydown", (e) => {
if (e.key === "Backspace" && !input.value && input.previousElementSibling) {
input.previousElementSibling.focus();
}
});

document.body.style.background = "#8c8c8c";

document.getElementById("errorScreen").classList.add("hidden");
document.getElementById("inputScreen").classList.remove("hidden");

Array.from(inputsContainer.children).forEach(input => input.value = "");
inputsContainer.children[0].focus();
}

inputsContainer.children[0].focus();
</script>

</body>
</html>
